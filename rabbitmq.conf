# RabbitMQ Configuration
# Enable management UI on port 15672
management.tcp.port = 15672

# STOMP plugin configuration (WebSocket)
stomp.listeners.tcp.1 = 5672
web_stomp.tcp.port = 15674

# Default user permissions
default_vhost = /
default_user = guest
default_pass = guest
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Allow guest login from any host (dev only)
loopback_users = none

# Heartbeat
heartbeat = 60
